# ==========================================================
#  PROD profile — production
#  Activate: --spring.profiles.active=prod
#
#  REQUIRED environment variables:
#    DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, APP_CORS_ALLOWED_ORIGINS
# ==========================================================

# Database (no defaults — must be provided)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP defaults under load)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA — DO NOT use ddl-auto=update in prod; rely on migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=INFO
logging.level.com.stockflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# CORS must be restricted to known frontends — fail fast if not set
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Swagger disabled in prod (comment the next two lines if you want it enabled)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
