# ==========================================================
#  DEV profile — local development
#  Activate: --spring.profiles.active=dev  (default in application.properties)
# ==========================================================

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — auto-migrate schema, log SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.stockflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS permissive in dev
app.cors.allowed-origins=*
