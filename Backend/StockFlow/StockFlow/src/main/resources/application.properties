# ==========================================================
#  StockFlow - common configuration (shared by all profiles)
#  Profile-specific overrides: application-{profile}.properties
#  Activate via: -Dspring.profiles.active=dev|prod
# ==========================================================

spring.application.name=stockflow
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${SERVER_PORT:8080}

# JPA/Hibernate (common defaults)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (secret MUST be overridden in prod via JWT_SECRET env var)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated, "*" = any)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.stockflow.controller
